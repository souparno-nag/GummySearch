[tool.ruff]
target-version = "py311"
line-length = 100
src = ["app", "workers", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "N",   # pep8-naming
    "ANN", # flake8-annotations — Constitution II: every signature is typed
    "T20", # flake8-print — Constitution II: no print() outside scripts
]
ignore = [
    "ANN401", # Any is permitted with the inline justification Constitution II requires
]

[tool.ruff.lint.per-file-ignores]
# Scripts are the one place print() and looser typing are allowed (Constitution II).
"scripts/*" = ["T20", "ANN"]
"alembic/*" = ["ANN"]
"tests/*" = ["ANN"]

[tool.ruff.lint.isort]
known-first-party = ["app", "workers"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=80 --strict-markers"

[tool.coverage.run]
source = ["app"]
branch = true
omit = [
    "app/ai/prompts/*",  # versioned prompt text, not executable logic
]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
